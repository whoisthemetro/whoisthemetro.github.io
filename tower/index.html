<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c0908">
  <meta name="description" content="Choose your destiny. Enter the worlds of whoistheMETRO.">
  <title>whoistheMETRO | Choose Your Destiny</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Trade+Winds&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./tower.css?v=7">
</head>
<body>
  <button id="music-toggle" type="button" aria-label="Play music" title="Play music" aria-pressed="false"><span aria-hidden="true">&#9835;</span></button>
  <canvas id="landscape" aria-hidden="true"></canvas>
  <main>
    <header><h1>Choose Your Destiny</h1></header>
    <nav class="tower" aria-label="Choose a destination">
      <button class="stone" data-art="bfam" data-url="/bfam/" aria-pressed="false"><span class="name">BFAM</span><canvas class="portrait" width="40" height="48" aria-hidden="true"></canvas><span class="marker" aria-hidden="true"></span></button>
      <button class="stone" data-art="venue" data-url="/#venue" aria-pressed="false"><span class="name">The<br>Venue</span><canvas class="portrait" width="40" height="48" aria-hidden="true"></canvas><span class="marker" aria-hidden="true"></span></button>
      <button class="stone" data-art="studio" data-url="/#studio" aria-pressed="false"><span class="name">The<br>Studio</span><canvas class="portrait" width="40" height="48" aria-hidden="true"></canvas><span class="marker" aria-hidden="true"></span></button>
      <button class="stone" data-art="portfolio" data-url="/3D/" aria-pressed="false"><span class="name">3D<br>Portfolio</span><canvas class="portrait" width="40" height="48" aria-hidden="true"></canvas><span class="marker" aria-hidden="true"></span></button>
      <button class="stone" data-art="mix" data-url="/mixandmaster/" aria-pressed="false"><span class="name">Mix &amp;<br>Master</span><canvas class="portrait" width="40" height="48" aria-hidden="true"></canvas><span class="marker" aria-hidden="true"></span></button>
      <button class="stone selected" data-art="world" data-url="/" aria-pressed="true"><span class="name">Interactive<br>World</span><canvas class="portrait" width="40" height="48" aria-hidden="true"></canvas><span class="marker" aria-hidden="true"></span></button>
    </nav>
    <a id="enter" class="enter" href="/">Enter World <span aria-hidden="true">&#9656;</span></a>
    <footer><a href="/">whoistheMETRO</a><span id="destination-status" class="sr-only" aria-live="polite">Interactive World selected</span></footer>
  </main>
  <script src="./tower.js?v=7" defer></script>
</body>
</html>
