<!doctype html><html><head><meta charset="utf-8">
<title>robot look</title>
<style>html,body{margin:0;background:#1a1a1e;overflow:hidden}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script></head><body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(600, 800);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
const camera = new THREE.PerspectiveCamera(35, 600 / 800, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(2, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x88bbff, 1.2); rim.position.set(-3, 2, -3); scene.add(rim);
scene.add(new THREE.GridHelper(4, 8, 0x445, 0x333));

let mixer = null, clip = null, action = null, root = null;
const D = window.RV = {};

new GLTFLoader().load("assets/models/robot.glb", (gltf) => {
  root = gltf.scene;
  // normalize to 1.6 m tall like the ghosts do, and sit it on the floor
  const box0 = new THREE.Box3().setFromObject(root);
  const size0 = box0.getSize(new THREE.Vector3());
  const s = 1.6 / size0.y;
  root.scale.setScalar(s);
  root.updateMatrixWorld(true);
  const box1 = new THREE.Box3().setFromObject(root);
  root.position.y -= box1.min.y;
  root.position.x -= (box1.max.x + box1.min.x) / 2;
  root.position.z -= (box1.max.z + box1.min.z) / 2;
  scene.add(root);

  mixer = new THREE.AnimationMixer(root);
  clip = gltf.animations[0];
  action = mixer.clipAction(clip);
  action.play();

  const bones = [];
  root.traverse(o => { if (o.isBone) bones.push(o.name); });
  D.info = {
    rawSize: [+size0.x.toFixed(3), +size0.y.toFixed(3), +size0.z.toFixed(3)],
    scale: +s.toFixed(4),
    clips: gltf.animations.map(a => ({ name: a.name, dur: +a.duration.toFixed(2), tracks: a.tracks.length })),
    bones,
    tracks: clip.tracks.map(t => t.name),
  };
  D.ready = true;
});

// aim the camera at the whole body by default
camera.position.set(0, 1.0, 3.0);
camera.lookAt(0, 0.8, 0);

// a SkinnedMesh's Box3 is the BIND pose, so bounds come from live bone
// positions instead — which is also how i'll have to place him in the room
D.bounds = () => {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  root.traverse(o => { if (o.isBone) { o.getWorldPosition(v); box.expandByPoint(v); } });
  return box;
};
D.setTime = (t) => { if (!mixer) return; action.paused = false; mixer.setTime(t); renderer.render(scene, camera); };
D.view = (px, py, pz, tx, ty, tz) => { camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz); renderer.render(scene, camera); };
// frame whatever the body is doing right now, from angle `a` radians around it
D.frame = (a = 0, pad = 1.6) => {
  const box = D.bounds();
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z) * pad;
  const d = r / Math.tan(camera.fov * Math.PI / 360);
  camera.position.set(c.x + Math.sin(a) * d, c.y + s.y * 0.15, c.z + Math.cos(a) * d);
  camera.lookAt(c);
  renderer.render(scene, camera);
  return { center: [+c.x.toFixed(2), +c.y.toFixed(2), +c.z.toFixed(2)], size: [+s.x.toFixed(2), +s.y.toFixed(2), +s.z.toFixed(2)] };
};
D.headOf = () => D.bonePos("Head_02");
D.bonePos = (name) => {
  let b = null; root.traverse(o => { if (o.name === name) b = o; });
  if (!b) return null;
  const v = new THREE.Vector3(); b.getWorldPosition(v);
  return [+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)];
};

renderer.setAnimationLoop(() => { renderer.render(scene, camera); });
</script></body></html>
