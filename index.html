        function flashAllLights() {
            // Flash player - stronger
            playerEmissiveParts.forEach(part => {
                if (part.material) part.material.emissiveIntensity = 2.0;
            });
            
            // Flash acoustic panels and letters - much stronger
            acousticPanels.forEach(p => {
                if (p.panel && p.panel.material) p.panel.material.emissiveIntensity = 1.5;
                if (p.letterGroup) {
                    p.letterGroup.children.forEach(mesh => {
                        if (mesh.material) mesh.material.opacity = 1.0;
                    });
                }
            });
            
            // Flash corner lights - stronger
            cornerLights.forEach(cl => {
                cl.light.intensity = 3.0;
            });
            
            // Flash corner pillars
            cornerPillars.forEach(cp => {
                cp.pillar.material.emissiveIntensity = 1.5;
                cp.screen.material.color.setRGB(1, 1, 1);
            });
            
            // Fade back
            const startTime = Date.now();
            const duration = 250;
            
            function fade() {
                const progress = Math.min((Date.now() - startTime) / duration, 1);
                const playerIntensity = 2.0 - (progress * 1.85);
                const panelIntensity = 1.5 - (progress * 1.4);
                const lightIntensity = 3.0 - (progress * 2.7);
                const letterOpacity = 1.0 - (progress * 0.3);
                const pillarIntensity = 1.5 - (progress * 1.3);
                
                playerEmissiveParts.forEach(part => {
                    if (part.material) part.material.emissiveIntensity = playerIntensity;
                });
                
                acousticPanels.forEach(p => {
                    if (p.panel && p.panel.material) p.panel.material.emissiveIntensity = panelIntensity;
                    if (p.letterGroup) {
                        p.letterGroup.children.forEach(mesh => {
                            if (mesh.material) mesh.material.opacity = letterOpacity;
                        });
                    }
                });
                
                cornerLights.forEach(cl => {
                    cl.light.intensity = lightIntensity;
                });
                
                cornerPillars.forEach(cp => {
                    cp.pillar.material.emissiveIntensity = pillarIntensity;
                });
                
                if (progress < 1) requestAnimationFrame(fade);
            }
            fade();
        }

        function updateAudioReactiveLights() {
            if (!analyser || !isPlaying) return;
            
            analyser.getByteFrequencyData(audioDataArray);
            
            // Get average of bass frequencies (more sensitive)
            let bass = 0;
            for (let i = 0; i < 15; i++) bass += audioDataArray[i];
            bass = bass / 15 / 255;
            bass = Math.pow(bass, 0.8); // Boost sensitivity
            
            // Get average of mid frequencies
            let mid = 0;
            for (let i = 15; i < 80; i++) mid += audioDataArray[i];
            mid = mid / 65 / 255;
            mid = Math.pow(mid, 0.8); // Boost sensitivity
            
            // Get high frequencies
            let high = 0;
            for (let i = 80; i < 128; i++) high += audioDataArray[i];
            high = high / 48 / 255;
            
            // Detect dominant frequency for key estimation
            detectKey();
            
            // Update acoustic panels - much stronger reaction
            acousticPanels.forEach((p, i) => {
                if (p.panel && p.panel.material) {
                    p.panel.material.emissiveIntensity = 0.1 + mid * 1.5 + bass * 0.8;
                }
                // Make letters pulse strongly with bass
                if (p.letterGroup) {
                    p.letterGroup.children.forEach(mesh => {
                        if (mesh.material) mesh.material.opacity = 0.5 + bass * 0.5 + high * 0.2;
                    });
                }
            });
            
            // Update corner lights - much stronger bass reaction
            cornerLights.forEach((cl, i) => {
                cl.light.intensity = cl.baseIntensity + bass * 4.0 + mid * 1.5;
            });
            
            // Update corner pillars
            cornerPillars.forEach((cp, i) => {
                cp.pillar.material.emissiveIntensity = 0.2 + bass * 1.2 + mid * 0.6;
            });
            
            // Player glow - stronger reaction
            playerEmissiveParts.forEach(part => {
                if (part.material) {
                    part.material.emissiveIntensity = 0.15 + bass * 1.0 + mid * 0.5;
                }
            });
        }
        
        function detectKey() {
            if (!analyser || !audioDataArray) return;
            
            // Simple key detection based on prominent frequency bins
            // Map FFT bins to musical notes (approximate)
            // At 44100Hz sample rate with 256 FFT size, each bin = ~172Hz
            // We'll look at the lower frequencies where most melodic content is
            
            let maxVal = 0;
            let maxBin = 0;
            
            // Look at bins 1-30 (roughly 170Hz - 5100Hz, covering most melodic range)
            for (let i = 1; i < 30; i++) {
                if (audioDataArray[i] > maxVal) {
                    maxVal = audioDataArray[i];
                    maxBin = i;
                }
            }
            
            // Convert bin to approximate note (very rough estimation)
            // This maps the dominant frequency to a key (0-11)
            if (maxVal > 100) { // Only update if there's significant audio
                detectedKey = (maxBin * 3) % 12; // Rough mapping
            }
        }

        // ============================================
        // SYNTH WITH DELAY AND REVERB
        // ============================================
        
        function playSynthSound(noteIndex) {
            flashAllLights();
            
            // Base frequency for C4
            const baseFreq = 261.63;
            
            // Map the clicked key to the detected scale
            const scaleNotes = currentScale.map(n => (n + detectedKey) % 12);
            
            // Find the closest note in the scale
            const octave = Math.floor(noteIndex / 12);
            const noteInOctave = noteIndex % 12;
            
            // Find closest scale note
            let closestNoteIndex = 0;
            let closestNote = scaleNotes[0];
            let minDist = 12;
            scaleNotes.forEach((n, idx) => {
                const dist = Math.min(Math.abs(n - noteInOctave), 12 - Math.abs(n - noteInOctave));
                if (dist < minDist) {
                    minDist = dist;
                    closestNote = n;
                    closestNoteIndex = idx;
                }
            });
            
            if (arpeggioEnabled) {
                // Stop existing arpeggio if running
                if (arpeggioInterval) {
                    clearInterval(arpeggioInterval);
                }
                
                // Create new audio context for arpeggio
                arpeggioCtx = new (window.AudioContext || window.webkitAudioContext)();
                arpeggioBaseNote = closestNoteIndex;
                
                // Build arpeggio notes
                const arpNotes = [];
                for (let i = 0; i < 4; i++) {
                    const scaleIdx = (closestNoteIndex + i) % scaleNotes.length;
                    const noteOctave = octave + Math.floor((closestNoteIndex + i) / scaleNotes.length);
                    const note = noteOctave * 12 + scaleNotes[scaleIdx];
                    arpNotes.push(note);
                }
                
                // Play persistent arpeggio
                let arpIndex = 0;
                const playArpNote = () => {
                    if (!arpeggioEnabled || !arpeggioCtx) return;
                    
                    const note = arpNotes[arpIndex % arpNotes.length];
                    const freq = baseFreq * Math.pow(2, note / 12);
                    playSynthNote(arpeggioCtx, freq, arpeggioCtx.currentTime, 0.4);
                    flashAllLights();
                    arpIndex++;
                };
                
                // Play first note immediately
                playArpNote();
                
                // Continue arpeggio indefinitely
                arpeggioInterval = setInterval(playArpNote, 120);
            } else {
                // Single note in key
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const quantizedNote = octave * 12 + closestNote;
                const freq = baseFreq * Math.pow(2, quantizedNote / 12);
                playSynthNote(ctx, freq, ctx.currentTime, 0.6);
            }
        }
        
        function stopArpeggio() {
            if (arpeggioInterval) {
                clearInterval(arpeggioInterval);
                arpeggioInterval = null;
            }
            if (arpeggioCtx) {
                arpeggioCtx.close();
                arpeggioCtx = null;
            }
        }
        
        function playSynthNote(ctx, freq, startTime, volume) {
            // Get waveform based on selected sound type
            const waveforms = ['sawtooth', 'square', 'sine', 'triangle'];
            const mainWave = waveforms[synthSoundType];
            
            // Main oscillators (detuned for thickness)
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const osc3 = ctx.createOscillator();
            
            osc1.type = mainWave;
            osc2.type = mainWave;
            osc3.type = synthSoundType === 2 ? 'sine' : 'square'; // Sub oscillator
            
            osc1.frequency.setValueAtTime(freq, startTime);
            osc2.frequency.setValueAtTime(freq * 1.005, startTime); // Slight detune
            osc3.frequency.setValueAtTime(freq * 0.5, startTime); // Sub octave
            
            // Filter - different settings per sound type
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            
            if (synthSoundType === 0) { // Saw - brighter
                filter.frequency.setValueAtTime(4000, startTime);
                filter.frequency.exponentialRampToValueAtTime(1000, startTime + 0.5);
                filter.Q.value = 2;
            } else if (synthSoundType === 1) { // Square - resonant
                filter.frequency.setValueAtTime(2500, startTime);
                filter.frequency.exponentialRampToValueAtTime(600, startTime + 0.4);
                filter.Q.value = 4;
            } else if (synthSoundType === 2) { // Sine - warm, open filter
                filter.frequency.setValueAtTime(8000, startTime);
                filter.frequency.exponentialRampToValueAtTime(2000, startTime + 0.8);
                filter.Q.value = 0.5;
            } else { // Triangle - mellow
                filter.frequency.setValueAtTime(3000, startTime);
                filter.frequency.exponentialRampToValueAtTime(800, startTime + 0.6);
                filter.Q.value = 1;
            }
            
            // Gain envelope
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume * 0.4, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(volume * 0.2, startTime + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.5);
            
            // Delay
            const delay = ctx.createDelay();
            delay.delayTime.value = 0.3;
            const delayGain = ctx.createGain();
            delayGain.gain.value = 0.3;
            const feedback = ctx.createGain();
            feedback.gain.value = 0.4;
            
            // Reverb (convolver with impulse response)
            const convolver = ctx.createConvolver();
            const reverbGain = ctx.createGain();
            reverbGain.gain.value = 0.3;
            
            // Create impulse response for reverb
            const sampleRate = ctx.sampleRate;
            const length = sampleRate * 2;
            const impulse = ctx.createBuffer(2, length, sampleRate);
            for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
                }
            }
            convolver.buffer = impulse;
            
            // Connect oscillators
            osc1.connect(filter);
            osc2.connect(filter);
            osc3.connect(filter);
            
            // Dry path
            filter.connect(gain);
            gain.connect(ctx.destination);
            
            // Delay path
            gain.connect(delay);
            delay.connect(delayGain);
            delayGain.connect(ctx.destination);
            delay.connect(feedback);
            feedback.connect(delay);
            
            // Reverb path
            gain.connect(convolver);
            convolver.connect(reverbGain);
            reverbGain.connect(ctx.destination);
            
            osc1.start(startTime);
            osc2.start(startTime);
            osc3.start(startTime);
            osc1.stop(startTime + 2);
            osc2.stop(startTime + 2);
            osc3.stop(startTime + 2);
        }
        
        function playDrumSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            
            flashAllLights();
            
            // Create reverb convolver
            const convolver = ctx.createConvolver();
            const reverbTime = 0.8;
            const sampleRate = ctx.sampleRate;
            const reverbLength = sampleRate * reverbTime;
            const impulse = ctx.createBuffer(2, reverbLength, sampleRate);
            for (let channel = 0; channel < 2; channel++) {
                const channelData = impulse.getChannelData(channel);
                for (let i = 0; i < reverbLength; i++) {
                    channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / reverbLength, 2.5);
                }
            }
            convolver.buffer = impulse;
            
            // Dry/wet mix
            const dryGain = ctx.createGain();
            const wetGain = ctx.createGain();
            dryGain.gain.value = 0.85; // Mostly dry
            wetGain.gain.value = 0.25; // Subtle reverb
            
            convolver.connect(wetGain);
            wetGain.connect(ctx.destination);
            
            if (type === 'kick') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(dryGain);
                gain.connect(convolver);
                dryGain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'snare') {
                const noise = ctx.createBufferSource();
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
                noise.buffer = noiseBuffer;
                
                const noiseGain = ctx.createGain();
                const noiseFilter = ctx.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.value = 1000;
                noiseGain.gain.setValueAtTime(0.8, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(dryGain);
                noiseGain.connect(convolver);
                dryGain.connect(ctx.destination);
                
                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                oscGain.gain.setValueAtTime(0.7, now);
                oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(oscGain);
                oscGain.connect(dryGain);
                oscGain.connect(convolver);
                
                noise.start(now);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hihat') {
                const noise = ctx.createBufferSource();
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
                noise.buffer = noiseBuffer;
                
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 7000;
                
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(dryGain);
                gain.connect(convolver);
                dryGain.connect(ctx.destination);
                noise.start(now);
            } else if (type === 'hitom') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(dryGain);
                gain.connect(convolver);
                dryGain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'midtom') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.18);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(dryGain);
                gain.connect(convolver);
                dryGain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'lowtom') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
                gain.gain.setValueAtTime(0.9, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(dryGain);
                gain.connect(convolver);
                dryGain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'crash1' || type === 'crash2') {
                // Crash cymbals with pitch variation
                const noise = ctx.createBufferSource();
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
                noise.buffer = noiseBuffer;
                
                // Different pitch for each cymbal + slight random variation
                const basePitch = type === 'crash1' ? 5500 : 4500;
                const pitchVariation = (Math.random() - 0.5) * 400; // ±200Hz variation
                
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = basePitch + pitchVariation;
                
                // Add a bandpass for more tonal character
                const bandpass = ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.value = (basePitch + pitchVariation) * 1.2;
                bandpass.Q.value = 0.5;
                
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.55, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.4);
                
                noise.connect(filter);
                filter.connect(bandpass);
                bandpass.connect(gain);
                gain.connect(dryGain);
                gain.connect(convolver);
                dryGain.connect(ctx.destination);
                noise.start(now);
            }
        }

        function selectTrack(index) {
            const tracks = CONFIG.playlists[currentPlaylist].tracks;
            if (tracks.length === 0) return;
            
            currentTrack = index;
            const track = tracks[index];
            document.getElementById('track-title').textContent = track.title;
            document.querySelectorAll('.playlist-item').forEach((item, i) => item.classList.toggle('active', i === index));
            
            if (track.file) {
                audioElement.src = track.file;
                audioElement.load();
                if (isPlaying) {
                    audioElement.play().then(() => {
                        setupAudioAnalyser();
                    }).catch(e => console.log('Play error:', e));
                }
            }
        }

        function togglePlay() {
            const tracks = CONFIG.playlists[currentPlaylist].tracks;
            if (tracks.length === 0) return;
            
            if (!audioElement.src || audioElement.src === '') {
                selectTrack(0);
            }
            
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
                document.getElementById('play-pause-btn').textContent = '▶';
                document.getElementById('album-art').classList.remove('playing');
            } else {
                audioElement.play().then(() => {
                    isPlaying = true;
                    document.getElementById('play-pause-btn').textContent = '⏸';
                    document.getElementById('album-art').classList.add('playing');
                    setupAudioAnalyser();
                }).catch(e => {
                    console.log('Play error:', e);
                    isPlaying = false;
                    document.getElementById('play-pause-btn').textContent = '▶';
                    document.getElementById('album-art').classList.remove('playing');
                });
            }
        }

        function setupAudioAnalyser() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioContext.createMediaElementSource(audioElement);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    audioDataArray = new Uint8Array(analyser.frequencyBinCount);
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                } catch (e) {
                    console.log('Analyser setup error:', e);
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function updateProgress() {
            if (audioElement.duration) {
                const percent = (audioElement.currentTime / audioElement.duration) * 100;
                document.getElementById('progress-fill').style.width = percent + '%';
                document.getElementById('current-time').textContent = formatTime(audioElement.currentTime);
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function prevTrack() { 
            const tracks = CONFIG.playlists[currentPlaylist].tracks;
            if (tracks.length === 0) return;
            selectTrack((currentTrack - 1 + tracks.length) % tracks.length); 
        }
        function nextTrack() { 
            const tracks = CONFIG.playlists[currentPlaylist].tracks;
            if (tracks.length === 0) return;
            selectTrack((currentTrack + 1) % tracks.length); 
        }

        function enterStation(station) {
            currentStation = station;
            if (station.type === 'computer') {
                document.getElementById('computer-interface').classList.add('active');
                gsapLike(camera.position, { x: -0.5, y: 3, z: -2 }, 500);
            } else if (station.type === 'tv') {
                document.getElementById('tv-interface').classList.add('active');
                selectChannel(0);
                gsapLike(camera.position, { x: 5.5, y: 2.5, z: -2 }, 500);
            } else if (station.type === 'drums') {
                document.getElementById('drums-interface').classList.add('active');
                // Hide player when at drums
                if (player) player.visible = false;
                // Camera positioned behind the drums, looking at them like sitting at the throne
                gsapLike(camera.position, { x: -6, y: 1.8, z: 0.8 }, 500);
                gsapLike(camera.rotation, { x: -0.2, y: 0, z: 0 }, 500);
            } else if (station.type === 'synth') {
                document.getElementById('synth-interface').classList.add('active');
                // Hide player when at synth
                if (player) player.visible = false;
                // Camera positioned behind the synth, zoomed out to see full keyboard
                gsapLike(camera.position, { x: -2.5, y: 2.8, z: -2.5 }, 500);
                gsapLike(camera.rotation, { x: -0.5, y: 0, z: 0 }, 500);
            }

        function exitStation() {
            if (!currentStation) return;
            if (currentStation.type === 'tv') document.getElementById('tv-video').src = '';
            // Show player again when leaving drums or synth
            if ((currentStation.type === 'drums' || currentStation.type === 'synth') && player) {
                player.visible = true;
            }
            // Stop arpeggio when leaving synth
            if (currentStation.type === 'synth') {
                stopArpeggio();
            }
            document.getElementById('computer-interface').classList.remove('active');
            document.getElementById('tv-interface').classList.remove('active');
            document.getElementById('drums-interface').classList.remove('active');
            document.getElementById('synth-interface').classList.remove('active');
            gsapLike(camera.position, { x: 0, y: 8, z: 12 }, 500);
            gsapLike(camera.rotation, { x: -0.5, y: 0, z: 0 }, 500);
            currentStation = null;
        }

        function gsapLike(obj, target, duration) {
            const start = {}, startTime = Date.now();
            for (let key in target) start[key] = obj[key];
            function update() {
                const progress = Math.min((Date.now() - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                for (let key in target) obj[key] = start[key] + (target[key] - start[key]) * eased;
                if (progress < 1) requestAnimationFrame(update);
            }
            update();
        }

        // ============================================
        // GAME LOOP
        // ============================================
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Cat breathing
            if (cat) {
                catBreathTime += 0.03;
                cat.scale.y = 1 + Math.sin(catBreathTime) * 0.03;
                cat.position.y = 0.55 + Math.sin(catBreathTime) * 0.01;
            }
            
            // Update monitor display with music info when not at station
            screensaverTime += 0.02;
            if (monitorScreen && !currentStation) {
                // Update scrolling text offset
                const tracks = CONFIG.playlists[currentPlaylist].tracks;
                const track = tracks[currentTrack];
                if (track) {
                    const ctx = monitorDisplayCanvas.getContext('2d');
                    ctx.font = 'bold 36px monospace';
                    const textWidth = ctx.measureText(track.title).width;
                    if (textWidth > 450) {
                        songTextOffset += 1;
                        if (songTextOffset > textWidth + 50) {
                            songTextOffset = 0;
                        }
                    }
                }
                updateMonitorDisplay();
            }
            
            // TV photo slideshow (change every 5 seconds)
            if (tvScreen && !currentStation) {
                photoChangeTimer++;
                if (photoChangeTimer > 300) { // ~5 seconds at 60fps
                    photoChangeTimer = 0;
                    currentPhotoIndex = (currentPhotoIndex + 1) % CONFIG.photos.length;
                }
                updateTVDisplay();
            }
            
            // Corner pillars screensaver effect
            cornerPillars.forEach((cp, i) => {
                const offset = i * 2;
                const r = Math.sin(screensaverTime * 1.2 + offset) * 0.5 + 0.5;
                const g = Math.sin(screensaverTime * 0.8 + offset + 2) * 0.5 + 0.5;
                const b = Math.sin(screensaverTime * 1.5 + offset + 4) * 0.5 + 0.5;
                cp.screen.material.color.setRGB(r, g, b);
                cp.pillar.material.emissive.setRGB(r * 0.3, g * 0.5, b * 0.3);
            });
            
            // Audio reactive lights
            updateAudioReactiveLights();
            
            if (!gameStarted || currentStation) {
                renderer.render(scene, camera);
                return;
            }

            // Check if mobile
            const isMobile = window.innerWidth <= 768;
            const speed = 0.04;
            const friction = 0.88;
            
            // Desktop keyboard controls
            if (keys['w']) playerVelocity.z -= speed;
            if (keys['s']) playerVelocity.z += speed;
            if (keys['a']) playerVelocity.x -= speed;
            if (keys['d']) playerVelocity.x += speed;
            
            // Mobile touch-drag controls (direct position delta)
            if (window.mobileMove && isMobile) {
                playerVelocity.x += window.mobileMove.x;
                playerVelocity.z += window.mobileMove.z;
                // Reset after applying so it doesn't accumulate
                window.mobileMove.x = 0;
                window.mobileMove.z = 0;
            }
            
            playerVelocity.multiplyScalar(friction);
            
            if (!isGrounded) {
                verticalVelocity -= gravity;
                player.position.y += verticalVelocity;
                
                // Check if landing on bed
                const bedHeight = 0.7; // Height of bed surface
                const onBedX = player.position.x > 4.4 && player.position.x < 6.6;
                const onBedZ = player.position.z > 2.25 && player.position.z < 5.75;
                
                if (onBedX && onBedZ && player.position.y <= bedHeight && verticalVelocity < 0) {
                    // Landing on bed - bounce the player!
                    player.position.y = bedHeight;
                    // Bounce player back up (lose some energy each bounce)
                    const bounceStrength = Math.abs(verticalVelocity) * 0.65;
                    verticalVelocity = Math.max(bounceStrength, 0.12); // Minimum bounce
                    isGrounded = false; // Keep in air for bounce
                    isOnBed = true;
                    // Trigger mattress bounce
                    bedBounceVelocity = -0.15;
                } else if (player.position.y <= 0) {
                    player.position.y = 0;
                    verticalVelocity = 0;
                    isGrounded = true;
                    isOnBed = false;
                }
            } else {
                // Check if we walked off the bed
                const onBedX = player.position.x > 4.4 && player.position.x < 6.6;
                const onBedZ = player.position.z > 2.25 && player.position.z < 5.75;
                
                if (isOnBed && (!onBedX || !onBedZ)) {
                    // Walked off bed, start falling
                    isGrounded = false;
                    isOnBed = false;
                }
                
                // If on bed and pressing jump, do a bigger bounce
                if (isOnBed && keys[' ']) {
                    verticalVelocity = jumpForce * 1.3; // Extra bounce on bed
                    isGrounded = false;
                    bedBounceVelocity = -0.2;
                }
            }
            
            const newX = player.position.x + playerVelocity.x;
            const newZ = player.position.z + playerVelocity.z;
            const playerRadius = 0.5;
            
            // Bed collision - only block at ground level, not when on bed or jumping over
            const bedCollider = { minX: 4.4, maxX: 6.6, minZ: 2.25, maxZ: 5.75 };
            const bedHeight = 0.7;
            
            // Regular colliders (furniture that blocks at all heights)
            const colliders = [
                { minX: -4, maxX: 3, minZ: -6.8, maxZ: -4.2 },
                { minX: 3.8, maxX: 7.2, minZ: -2.2, maxZ: 0.2 },
                { minX: -7, maxX: -5, minZ: -4, maxZ: -2 },
            ];
            
            let canMoveX = true, canMoveZ = true;
            
            // Check regular colliders
            for (const col of colliders) {
                if (newX + playerRadius > col.minX && newX - playerRadius < col.maxX &&
                    player.position.z + playerRadius > col.minZ && player.position.z - playerRadius < col.maxZ) {
                    canMoveX = false;
                }
                if (player.position.x + playerRadius > col.minX && player.position.x - playerRadius < col.maxX &&
                    newZ + playerRadius > col.minZ && newZ - playerRadius < col.maxZ) {
                    canMoveZ = false;
                }
            }
            
            // Bed collision - only blocks if player is at ground level (not on bed or jumping)
            if (player.position.y < bedHeight - 0.1) {
                if (newX + playerRadius > bedCollider.minX && newX - playerRadius < bedCollider.maxX &&
                    player.position.z + playerRadius > bedCollider.minZ && player.position.z - playerRadius < bedCollider.maxZ) {
                    canMoveX = false;
                }
                if (player.position.x + playerRadius > bedCollider.minX && player.position.x - playerRadius < bedCollider.maxX &&
                    newZ + playerRadius > bedCollider.minZ && newZ - playerRadius < bedCollider.maxZ) {
                    canMoveZ = false;
                }
            }
            
            if (newX > -7 && newX < 7 && canMoveX) player.position.x = newX;
            if (newZ > -5.5 && newZ < 6 && canMoveZ) player.position.z = newZ;
            
            // Mattress bounce physics
            if (bedMattress) {
                // Spring physics for mattress
                const displacement = bedMattress.position.y - bedBaseY;
                const springForce = -displacement * 0.15; // Spring constant
                const damping = -bedBounceVelocity * 0.1; // Damping
                bedBounceVelocity += springForce + damping;
                bedMattress.position.y += bedBounceVelocity;
                
                // Clamp mattress position
                if (bedMattress.position.y < bedBaseY - 0.15) {
                    bedMattress.position.y = bedBaseY - 0.15;
                    bedBounceVelocity *= -0.6; // Bounce back
                }
                if (bedMattress.position.y > bedBaseY + 0.08) {
                    bedMattress.position.y = bedBaseY + 0.08;
                }
            }

            nearStation = null;
            const prompt = document.getElementById('interaction-prompt');
            const isMobileDevice = window.innerWidth <= 768;
            stations.forEach(station => {
                const dist = player.position.distanceTo(station.position);
                if (dist < station.radius) {
                    nearStation = station;
                    prompt.textContent = isMobileDevice ? `Tap circle or E - ${station.label}` : `Press E - ${station.label}`;
                    prompt.classList.add('visible');
                }
                station.indicator.rotation.z += 0.02;
                station.indicator.material.opacity = 0.3 + Math.sin(Date.now() * 0.003) * 0.2;
            });
            if (!nearStation) prompt.classList.remove('visible');

            camera.position.x += (player.position.x - camera.position.x) * 0.05;
            camera.position.z += (player.position.z + 9 - camera.position.z) * 0.05;
            camera.lookAt(player.position.x, 1, player.position.z - 2);

            renderer.render(scene, camera);
        }

        function enterStudio() {
            document.getElementById('loading-screen').classList.add('hidden');
            gameStarted = true;
        }

        init();
    </script>
</body>
</html>
