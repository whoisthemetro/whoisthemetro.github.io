<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whoistheMETRO</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/images/metro.jpg">
</head>
<body>
<div id="siteTitle" class="site-title">whoistheMETRO</div>

<div class="parallax-layer" id="layer1"></div>
<div class="parallax-layer" id="layer2"></div>
<div class="parallax-layer" id="layer3"></div>

<main class="container">
  <div class="bio">
    <img src="assets/images/metro.jpg" alt="Metro profile picture">
    <p>Yo, I’m Metro - I'm a self taught music producer | audio engineer | mastering engineer.<br>I do 3D videos using Unreal Engine and Blender.</p>
    <p>Check out my work and if you like what you hear and see, consider hiring me to work on your next project!</p>
  </div>

  <div class="player">
    <div class="player-box">
      <h3 id="song-title"></h3>
      <p id="artist-credits"></p>
      <audio id="audio" controls preload="metadata"></audio>
      <div class="volume-control">
        <label for="volume">Volume:</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume control">
      </div>
      <div class="tracklist" id="tracklist"></div>
    </div>
  </div>
</main>

<div class="gallery">
  <h2>🎥 Videos</h2>
  <div class="video-grid">
    <iframe src="https://www.youtube.com/embed/video1" title="Video 1" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video2" title="Video 2" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video3" title="Video 3" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video4" title="Video 4" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video5" title="Video 5" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video6" title="Video 6" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video7" title="Video 7" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video8" title="Video 8" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/video9" title="Video 9" frameborder="0" allowfullscreen></iframe>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
