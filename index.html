<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metro's Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Courier New', monospace; background: #0a0a0a; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; touch-action: none; }
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        #interaction-prompt { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #00ff88; padding: 15px 30px; border-radius: 8px; font-size: 18px; opacity: 0; transition: opacity 0.3s; border: 1px solid #00ff88; text-shadow: 0 0 10px #00ff88; }
        #interaction-prompt.visible { opacity: 1; }
        #controls-hint { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #888; padding: 15px; border-radius: 8px; font-size: 12px; line-height: 1.8; }
        #controls-hint kbd { background: #333; padding: 2px 8px; border-radius: 4px; margin: 0 2px; }
        
        /* Mobile Controls - Complete Rewrite */
        #mobile-controls { display: none; }
        #mobile-touch-area { display: none; }
        
        /* Mobile Action Buttons - Fixed position, always visible */
        .mobile-buttons { 
            display: none;
            position: fixed; 
            right: 10px; 
            top: 50%;
            transform: translateY(-50%);
            flex-direction: column; 
            gap: 15px; 
            z-index: 9999;
        }
        .mobile-btn { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            background: rgba(0,0,0,0.9); 
            border: 3px solid #00ff88; 
            color: #00ff88; 
            font-size: 18px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .mobile-btn:active { background: #00ff88; color: #000; }
        .mobile-btn.exit-btn { border-color: #ff4757; color: #ff4757; }
        .mobile-btn.exit-btn:active { background: #ff4757; color: #fff; }
        
        /* Computer Interface */
        #computer-interface { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 900px; height: 80%; max-height: 600px; background: linear-gradient(145deg, #1a1a2e, #16213e); border-radius: 12px; display: none; flex-direction: column; overflow: hidden; pointer-events: auto; box-shadow: 0 0 60px rgba(0,255,136,0.3), inset 0 0 60px rgba(0,0,0,0.5); border: 2px solid #00ff88; }
        #computer-interface.active { display: flex; }
        .screen-header { background: linear-gradient(90deg, #0d0d0d, #1a1a1a); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
        .screen-title { color: #00ff88; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        .close-btn { background: #ff4757; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; transition: all 0.3s; }
        .close-btn:hover { background: #ff6b7a; transform: scale(1.1); }
        
        /* Music Player Layout */
        #music-player { flex: 1; display: flex; gap: 15px; padding: 15px; overflow: hidden; }
        .player-left { width: 160px; flex-shrink: 0; overflow-y: auto; }
        .player-right { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
        
        /* Playlist Folders */
        .playlist-folders { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px; }
        .folder-item { display: flex; align-items: center; padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: all 0.3s; margin-bottom: 5px; gap: 8px; }
        .folder-item:hover { background: rgba(0,255,136,0.1); }
        .folder-item.active { background: rgba(0,255,136,0.2); border-left: 3px solid #00ff88; }
        .folder-item .folder-icon { font-size: 18px; }
        .folder-item .folder-name { color: #fff; font-size: 13px; }
        .folder-item.locked { opacity: 0.6; }
        .folder-item.locked:hover { background: rgba(255,100,100,0.1); }
        
        /* Track Playlist */
        .playlist { overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px; flex: 1; min-height: 80px; }
        .playlist-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: all 0.3s; margin-bottom: 4px; }
        .playlist-item:hover { background: rgba(0,255,136,0.1); }
        .playlist-item.active { background: rgba(0,255,136,0.2); border-left: 3px solid #00ff88; }
        .playlist-item .track-num { color: #555; width: 25px; font-size: 11px; }
        .playlist-item .track-info { flex: 1; }
        .playlist-item .track-info .name { color: #fff; font-size: 12px; }
        .playlist-empty { color: #666; text-align: center; padding: 20px; font-style: italic; }
        
        /* Now Playing */
        .now-playing { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; flex-shrink: 0; }
        .now-playing .album-art { width: 50px; height: 50px; flex-shrink: 0; background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4); background-size: 400% 400%; animation: gradientShift 8s ease infinite; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .now-playing .album-art.playing { animation: gradientShift 2s ease infinite, pulse 1s ease infinite; }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .track-info-main { flex: 1; min-width: 0; }
        .track-info-main .track-title { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info-main .track-artist { font-size: 11px; color: #888; }
        
        /* Progress Bar */
        .progress-container { flex-shrink: 0; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00d4ff); width: 0%; transition: width 0.1s linear; }
        .time-display { display: flex; justify-content: space-between; color: #666; font-size: 11px; margin-top: 5px; }
        
        /* Player Controls - ALWAYS VISIBLE */
        .player-controls { display: flex !important; justify-content: center; align-items: center; gap: 15px; padding: 10px 0; flex-shrink: 0; visibility: visible !important; opacity: 1 !important; min-height: 80px; }
        .control-btn { background: transparent; border: 2px solid #00ff88; color: #00ff88; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; transition: all 0.3s; display: flex !important; align-items: center; justify-content: center; font-size: 16px; visibility: visible !important; opacity: 1 !important; flex-shrink: 0; }
        .control-btn:hover, .control-btn:active { background: #00ff88; color: #000; box-shadow: 0 0 20px rgba(0,255,136,0.5); }
        .control-btn.play-pause { width: 60px; height: 60px; font-size: 22px; }
        
        /* Secret Modal */
        #secret-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 200; }
        #secret-modal.active { display: flex; }
        .secret-content { background: linear-gradient(145deg, #1a1a2e, #16213e); padding: 30px; border-radius: 16px; text-align: center; border: 2px solid #ff6600; box-shadow: 0 0 40px rgba(255,102,0,0.3); max-width: 90%; width: 350px; }
        .secret-icon { font-size: 40px; margin-bottom: 15px; }
        .secret-title { color: #ff6600; font-size: 20px; margin-bottom: 15px; letter-spacing: 2px; }
        .secret-question { color: #fff; font-size: 14px; margin-bottom: 15px; }
        #secret-answer { width: 100%; padding: 12px; border: 2px solid #333; background: #0a0a0a; color: #fff; border-radius: 8px; font-size: 16px; text-align: center; margin-bottom: 15px; }
        #secret-answer:focus { outline: none; border-color: #ff6600; }
        .secret-buttons { display: flex; gap: 10px; justify-content: center; }
        .secret-buttons button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 14px; transition: all 0.3s; }
        .secret-buttons button:first-child { background: #ff6600; color: #fff; }
        .secret-buttons button:first-child:hover { background: #ff8833; }
        .secret-buttons button:last-child { background: #333; color: #fff; }
        .secret-buttons button:last-child:hover { background: #444; }
        .secret-error { color: #ff3333; margin-top: 10px; font-size: 13px; min-height: 18px; }
        
        /* TV Interface */
        #tv-interface { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 1000px; height: 80%; background: #000; border-radius: 8px; display: none; flex-direction: column; overflow: hidden; pointer-events: auto; box-shadow: 0 0 80px rgba(100,100,255,0.3); border: 3px solid #333; }
        #tv-interface.active { display: flex; }
        .tv-screen { flex: 1; background: #111; position: relative; }
        .tv-screen iframe { width: 100%; height: 100%; border: none; }
        .tv-controls { background: #1a1a1a; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #333; flex-wrap: wrap; }
        .channel-btn { background: #333; border: none; color: #fff; padding: 8px 15px; border-radius: 6px; cursor: pointer; transition: all 0.3s; font-family: inherit; font-size: 12px; }
        .channel-btn:hover, .channel-btn:active { background: #4a4a4a; }
        .channel-btn.active { background: #6366f1; }
        .tv-close { margin-left: auto; }
        
        /* Drums Interface */
        #drums-interface { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border-radius: 12px; padding: 15px 25px; display: none; pointer-events: auto; border: 2px solid #ff6600; box-shadow: 0 0 30px rgba(255,102,0,0.3); }
        #drums-interface.active { display: block; }
        .drums-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
        .drums-title { color: #ff6600; font-size: 18px; letter-spacing: 2px; }
        .drums-info { color: #888; font-size: 12px; }
        
        /* Synth Interface */
        #synth-interface { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border-radius: 12px; padding: 15px 25px; display: none; pointer-events: auto; border: 2px solid #ff00ff; box-shadow: 0 0 30px rgba(255,0,255,0.3); }
        #synth-interface.active { display: block; }
        .synth-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
        .synth-title { color: #ff00ff; font-size: 18px; letter-spacing: 2px; }
        .synth-info { color: #888; font-size: 12px; }
        
        /* Loading Screen */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s; }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-text { color: #00ff88; font-size: 24px; margin-bottom: 30px; letter-spacing: 4px; }
        .loading-bar { width: 300px; max-width: 80%; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        .loading-progress { height: 100%; background: #00ff88; width: 0%; animation: loading 2s ease-out forwards; }
        @keyframes loading { to { width: 100%; } }
        .enter-btn { margin-top: 40px; background: transparent; border: 2px solid #00ff88; color: #00ff88; padding: 15px 50px; font-size: 16px; letter-spacing: 3px; cursor: pointer; transition: all 0.3s; opacity: 0; animation: fadeIn 0.5s ease 2s forwards; font-family: inherit; }
        .enter-btn:hover, .enter-btn:active { background: #00ff88; color: #000; box-shadow: 0 0 30px rgba(0,255,136,0.5); }
        @keyframes fadeIn { to { opacity: 1; } }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        
        /* ==========================================
           MOBILE - Complete Rewrite
           ========================================== */
        
        @media (max-width: 900px), (pointer: coarse) {
            /* Hide desktop controls */
            #controls-hint { display: none !important; }
            
            /* Show mobile buttons - centered vertically on right */
            .mobile-buttons { 
                display: flex !important;
            }
            
            /* Music Player Mobile */
            #computer-interface { 
                width: 94%; 
                height: 65%; 
                max-height: 450px;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            #music-player { 
                flex-direction: column; 
                padding: 8px; 
                gap: 6px; 
            }
            .screen-header { padding: 10px 12px; }
            .screen-title { font-size: 11px; }
            .close-btn { width: 28px; height: 28px; }
            
            /* Folders horizontal scroll */
            .player-left { 
                width: 100%; 
                max-height: 50px; 
                overflow-x: auto; 
                overflow-y: hidden; 
            }
            .playlist-folders { 
                display: flex; 
                flex-direction: row;
                gap: 6px; 
                padding: 6px; 
                white-space: nowrap; 
            }
            .folder-item { 
                flex-shrink: 0; 
                padding: 6px 10px; 
            }
            .folder-item .folder-name { font-size: 10px; }
            .folder-item .folder-icon { font-size: 14px; }
            
            /* Tracks list */
            .player-right { flex: 1; min-height: 0; overflow: hidden; }
            .playlist { 
                flex: 1;
                max-height: 90px; 
                min-height: 50px;
                overflow-y: auto;
            }
            .playlist-item { padding: 8px; }
            .playlist-item .track-num { font-size: 10px; width: 20px; }
            .playlist-item .track-info .name { font-size: 11px; }
            
            /* Now playing */
            .now-playing { padding: 8px; gap: 10px; }
            .now-playing .album-art { width: 40px; height: 40px; font-size: 18px; }
            .track-info-main .track-title { font-size: 12px; }
            .track-info-main .track-artist { font-size: 10px; }
            
            /* Progress */
            .progress-container { margin: 4px 0; }
            .progress-bar { height: 8px; }
            .time-display { font-size: 9px; margin-top: 3px; }
            
            /* Transport controls - bigger for touch */
            .player-controls { 
                gap: 20px; 
                min-height: 60px; 
                padding: 8px 0;
            }
            .control-btn { 
                width: 44px; 
                height: 44px; 
                font-size: 16px; 
            }
            .control-btn.play-pause { 
                width: 54px; 
                height: 54px; 
                font-size: 20px; 
            }
            
            /* TV Interface */
            #tv-interface { 
                width: 94%; 
                height: 50%; 
                max-height: 350px;
                top: 50%;
                transform: translate(-50%, -50%);
            }
            .tv-controls { padding: 8px; gap: 6px; }
            .channel-btn { padding: 8px 12px; font-size: 10px; }
            
            /* Drums/Synth headers */
            #drums-interface, #synth-interface { 
                top: 10px; 
                padding: 8px 12px; 
                max-width: 85%; 
            }
            .drums-title, .synth-title { font-size: 14px; }
            .drums-info, .synth-info { font-size: 9px; }
            .drums-header, .synth-header { gap: 10px; }
            
            /* Secret Modal */
            .secret-content { 
                padding: 18px; 
                width: 88%;
                max-width: 300px;
            }
            .secret-icon { font-size: 30px; margin-bottom: 10px; }
            .secret-title { font-size: 17px; margin-bottom: 12px; }
            .secret-question { font-size: 12px; margin-bottom: 12px; }
            #secret-answer { padding: 10px; font-size: 14px; }
            .secret-buttons button { padding: 10px 16px; font-size: 12px; }
        }
        
        /* Portrait specific */
        @media (max-width: 500px) and (orientation: portrait) {
            #computer-interface { 
                height: 60%; 
                max-height: 400px;
            }
            .playlist { max-height: 70px; }
            .player-controls { gap: 15px; min-height: 50px; }
            .control-btn { width: 40px; height: 40px; font-size: 14px; }
            .control-btn.play-pause { width: 50px; height: 50px; font-size: 18px; }
        }
        
        /* Landscape specific */
        @media (orientation: landscape) and (max-height: 500px) {
            #computer-interface { 
                height: 85%; 
                max-height: none;
            }
            #music-player { flex-direction: row; }
            .player-left { 
                width: 100px; 
                max-height: none;
                overflow-y: auto;
                overflow-x: hidden;
            }
            .playlist-folders { flex-direction: column; }
            .playlist { max-height: 60px; }
            .player-controls { gap: 10px; min-height: 40px; }
            .control-btn { width: 32px; height: 32px; font-size: 12px; }
            .control-btn.play-pause { width: 40px; height: 40px; font-size: 16px; }
            
            #tv-interface { height: 80%; max-height: none; }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-text">METRO'S STUDIO</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <button class="enter-btn" id="enter-btn">ENTER</button>
    </div>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="interaction-prompt">Press E to interact</div>
            <div id="controls-hint">
                <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move<br>
                <kbd>Space</kbd> Jump<br>
                <kbd>E</kbd> Interact<br>
                <kbd>ESC</kbd> Exit Station
            </div>
            <div id="mobile-controls">
                <div class="mobile-buttons" id="mobile-buttons">
                    <button class="mobile-btn" id="btn-jump">↑</button>
                    <button class="mobile-btn" id="btn-interact">E</button>
                    <button class="mobile-btn exit-btn" id="btn-exit">X</button>
                </div>
            </div>
        </div>
        <div id="computer-interface">
            <div class="screen-header">
                <span class="screen-title">◉ Music Player</span>
                <button class="close-btn" id="computer-close-btn"></button>
            </div>
            <div id="music-player">
                <div class="player-left">
                    <div class="playlist-folders" id="playlist-folders"></div>
                </div>
                <div class="player-right">
                    <div class="playlist" id="playlist"></div>
                    <div class="now-playing">
                        <div class="album-art" id="album-art"><span style="font-size: 48px;">♪</span></div>
                        <div class="track-info-main">
                            <div class="track-title" id="track-title">Select a track</div>
                            <div class="track-artist" id="track-artist">Metro</div>
                        </div>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                        <div class="time-display"><span id="current-time">0:00</span><span id="total-time">0:00</span></div>
                    </div>
                    <div class="player-controls">
                        <button class="control-btn" id="prev-btn">⏮</button>
                        <button class="control-btn play-pause" id="play-pause-btn">▶</button>
                        <button class="control-btn" id="next-btn">⏭</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="secret-modal">
            <div class="secret-content">
                <div class="secret-icon">🔒</div>
                <div class="secret-title">Secret Vault</div>
                <div class="secret-question" id="secret-question"></div>
                <input type="text" id="secret-answer" placeholder="Enter answer..." autocomplete="off">
                <div class="secret-buttons">
                    <button id="secret-submit-btn">Submit</button>
                    <button id="secret-cancel-btn">Cancel</button>
                </div>
                <div class="secret-error" id="secret-error"></div>
            </div>
        </div>
        <div id="tv-interface">
            <div class="tv-screen"><iframe id="tv-video" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
            <div class="tv-controls">
                <span style="color: #666;">CHANNELS:</span>
                <div id="channel-buttons"></div>
                <button class="channel-btn tv-close" id="tv-close-btn">✕ EXIT</button>
            </div>
        </div>
        <div id="drums-interface">
            <div class="drums-header">
                <span class="drums-title">🥁 Drum Kit</span>
                <button class="close-btn" id="drums-close-btn"></button>
            </div>
            <div class="drums-info">Tap the drums to play!</div>
        </div>
        <div id="synth-interface">
            <div class="synth-header">
                <span class="synth-title">🎹 Synthesizer</span>
                <button class="close-btn" id="synth-close-btn"></button>
            </div>
            <div class="synth-info">Tap the keys to play!</div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>

        function setupAudio() {
            audioElement = new Audio();
            audioElement.crossOrigin = "anonymous";
            audioElement.preload = "auto";
            
            audioElement.addEventListener('ended', () => nextTrack());
            audioElement.addEventListener('timeupdate', updateProgress);
            audioElement.addEventListener('loadedmetadata', () => {
                document.getElementById('total-time').textContent = formatTime(audioElement.duration);
            });
            audioElement.addEventListener('canplaythrough', () => {
                if (isPlaying) {
                    audioElement.play().catch(e => console.log('Playback error:', e));
                }
            });
            audioElement.addEventListener('error', (e) => {
                console.log('Audio error, skipping to next track:', e);
                // Keep the play button visible and functional
                document.getElementById('play-pause-btn').textContent = '▶';
                // Skip to next track if current one fails to load
                const tracks = CONFIG.playlists[currentPlaylist].tracks;
                if (tracks.length > 1) {
                    setTimeout(() => nextTrack(), 500);
                }
            });
        }

        function createLetter(letter, material) {
            const group = new THREE.Group();
            const t = 0.08; // thickness
            const h = 1.2; // height
            const w = 0.8; // width
            
            const box = (sx, sy, sz, px, py, pz) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
                mesh.position.set(px, py, pz);
                return mesh;
            };
            
            switch(letter) {
                case 'M':
                    group.add(box(t, h, t, -w/2, 0, 0)); // left vertical
                    group.add(box(t, h, t, w/2, 0, 0));  // right vertical
                    group.add(box(t, h/2, t, -w/4, h/4, 0)); // left diagonal approx
                    group.add(box(t, h/2, t, w/4, h/4, 0));  // right diagonal approx
                    group.add(box(t, t, t, 0, 0, 0));  // center bottom
                    break;
                case 'E':
                    group.add(box(t, h, t, -w/3, 0, 0)); // vertical
                    group.add(box(w*0.6, t, t, 0, h/2-t/2, 0)); // top
                    group.add(box(w*0.5, t, t, -0.05, 0, 0)); // middle
                    group.add(box(w*0.6, t, t, 0, -h/2+t/2, 0)); // bottom
                    break;
                case 'T':
                    group.add(box(t, h, t, 0, 0, 0)); // vertical
                    group.add(box(w, t, t, 0, h/2-t/2, 0)); // top horizontal
                    break;
                case 'R':
                    group.add(box(t, h, t, -w/3, 0, 0)); // vertical
                    group.add(box(w*0.5, t, t, 0, h/2-t/2, 0)); // top
                    group.add(box(t, h/4, t, w/4, h/4, 0)); // right top vertical
                    group.add(box(w*0.5, t, t, 0, 0, 0)); // middle
                    group.add(box(t, h/2, t, w/4, -h/4, 0)); // right leg
                    break;
                case 'O':
                    group.add(box(t, h, t, -w/3, 0, 0)); // left
                    group.add(box(t, h, t, w/3, 0, 0));  // right
                    group.add(box(w*0.5, t, t, 0, h/2-t/2, 0)); // top
                    group.add(box(w*0.5, t, t, 0, -h/2+t/2, 0)); // bottom
                    break;
            }
            
            return group;
        }

        function updateSynthDisplay() {
            if (!synthDisplayCanvas) return;
            
            const ctx = synthDisplayCanvas.getContext('2d');
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 256, 64);
            
            // Sound type
            ctx.fillStyle = '#ff6600';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('SOUND:', 10, 25);
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(synthSoundNames[synthSoundType], 80, 25);
            
            // Arpeggio status
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('ARP:', 10, 50);
            ctx.fillStyle = arpeggioEnabled ? '#00ff88' : '#ff3333';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(arpeggioEnabled ? 'ON' : 'OFF', 60, 50);
            
            // Border
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.strokeRect(2, 2, 252, 60);
            
            if (synthDisplayTexture) {
                synthDisplayTexture.needsUpdate = true;
            }
        }
        
        function updateMonitorDisplay() {
            if (!monitorDisplayCanvas) return;
            
            const ctx = monitorDisplayCanvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, 256);
            gradient.addColorStop(0, '#0a1520');
            gradient.addColorStop(1, '#051010');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 256);
            
            // Get current track info from playlist
            const tracks = CONFIG.playlists[currentPlaylist].tracks;
            const track = tracks[currentTrack];
            const trackName = track ? track.title : 'No Track';
            
            // Header
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 18px monospace';
            ctx.fillText('♪ NOW PLAYING', 20, 35);
            
            // Animated song title (scrolling if too long)
            ctx.save();
            ctx.beginPath();
            ctx.rect(20, 50, 472, 60);
            ctx.clip();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px monospace';
            const textWidth = ctx.measureText(trackName).width;
            
            if (textWidth > 450) {
                // Scroll text
                const scrollX = 20 - songTextOffset;
                ctx.fillText(trackName + '     ' + trackName, scrollX, 95);
            } else {
                // Center text
                ctx.fillText(trackName, (512 - textWidth) / 2, 95);
            }
            ctx.restore();
            
            // Artist
            ctx.fillStyle = '#888888';
            ctx.font = '20px monospace';
            ctx.fillText('Metro', 20, 140);
            
            // Progress bar background
            ctx.fillStyle = '#333333';
            ctx.fillRect(20, 165, 472, 8);
            
            // Progress bar fill
            if (audioElement && audioElement.duration) {
                const progress = (audioElement.currentTime / audioElement.duration) * 472;
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(20, 165, progress, 8);
            }
            
            // Time
            const currentTime = audioElement ? formatTime(audioElement.currentTime) : '0:00';
            const totalTime = audioElement && audioElement.duration ? formatTime(audioElement.duration) : '0:00';
            ctx.fillStyle = '#666666';
            ctx.font = '14px monospace';
            ctx.fillText(currentTime, 20, 195);
            ctx.fillText(totalTime, 460, 195);
            
            // Play status indicator
            ctx.fillStyle = isPlaying ? '#00ff88' : '#ff6600';
            ctx.font = 'bold 24px monospace';
            ctx.fillText(isPlaying ? '▶ PLAYING' : '⏸ PAUSED', 180, 230);
            
            // Border
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.strokeRect(5, 5, 502, 246);
            
            // Corner accents
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(5, 5, 20, 3);
            ctx.fillRect(5, 5, 3, 20);
            ctx.fillRect(487, 5, 20, 3);
            ctx.fillRect(504, 5, 3, 20);
            ctx.fillRect(5, 248, 20, 3);
            ctx.fillRect(5, 231, 3, 20);
            ctx.fillRect(487, 248, 20, 3);
            ctx.fillRect(504, 231, 3, 20);
            
            if (monitorDisplayTexture) {
                monitorDisplayTexture.needsUpdate = true;
            }
        }

        function createDrumKit(x, y, z) {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9, roughness: 0.2 });
            const padMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.1 });
            const cymbalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.4 });
            
            // Main rack/frame - 4 vertical posts
            const postPositions = [[-1.1, -0.5], [1.1, -0.5], [-1.1, 0.7], [1.1, 0.7]];
            postPositions.forEach(([fx, fz]) => {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 1.6, 8), frameMat);
                post.position.set(fx, 0.8, fz);
                group.add(post);
            });
            
            // Horizontal bars connecting posts
            const hBar1 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.2, 8), frameMat);
            hBar1.rotation.z = Math.PI / 2;
            hBar1.position.set(0, 1.5, -0.5);
            group.add(hBar1);
            
            const hBar2 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 8), frameMat);
            hBar2.rotation.x = Math.PI / 2;
            hBar2.position.set(-0.9, 1.5, 0.1);
            group.add(hBar2);
            
            const hBar3 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 8), frameMat);
            hBar3.rotation.x = Math.PI / 2;
            hBar3.position.set(0.9, 1.5, 0.1);
            group.add(hBar3);
            
            // Helper function to create a drum pad with mesh head
            function createPad(px, py, pz, radius, drumType, tilt = 0) {
                const rim = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.06, 24), padMat);
                rim.position.set(px, py, pz);
                rim.rotation.x = tilt;
                rim.userData.drumType = drumType;
                rim.userData.isDrumPad = true;
                group.add(rim);
                
                const head = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.85, radius * 0.85, 0.02, 24), headMat);
                head.position.set(px, py + 0.04 * Math.cos(tilt), pz - 0.04 * Math.sin(tilt));
                head.rotation.x = tilt;
                head.userData.drumType = drumType;
                head.userData.isDrumPad = true;
                group.add(head);
                
                return { rim, head };
            }
            
            // Helper function to create cymbal
            function createCymbal(px, py, pz, radius, drumType, tilt = 0.1) {
                // Stand
                const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, py, 8), chromeMat);
                stand.position.set(px, py / 2, pz);
                group.add(stand);
                
                // Cymbal
                const cymbal = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.9, radius, 0.015, 32), cymbalMat);
                cymbal.position.set(px, py, pz);
                cymbal.rotation.x = tilt;
                cymbal.userData.drumType = drumType;
                cymbal.userData.isDrumPad = true;
                group.add(cymbal);
                
                // Bell
                const bell = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 8), cymbalMat);
                bell.position.set(px, py + 0.02, pz);
                bell.scale.y = 0.5;
                group.add(bell);
                
                return cymbal;
            }
            
            // KICK DRUM - Electronic bass drum tower (vertical design like Roland/Alesis)
            const kickTowerMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.3 });
            const kickPadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            
            // Main tower body
            const kickTower = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.5, 0.15), kickTowerMat);
            kickTower.position.set(0, 0.35, 0.1);
            group.add(kickTower);
            
            // Kick pad (the hitting surface) - vertical
            const kickPad = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08, 24), kickPadMat);
            kickPad.rotation.x = Math.PI / 2;
            kickPad.position.set(0, 0.35, 0.2);
            kickPad.userData.drumType = 'kick';
            kickPad.userData.isDrumPad = true;
            group.add(kickPad);
            
            // Kick pad mesh head
            const kickHead = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.02, 24), headMat);
            kickHead.rotation.x = Math.PI / 2;
            kickHead.position.set(0, 0.35, 0.25);
            kickHead.userData.drumType = 'kick';
            kickHead.userData.isDrumPad = true;
            group.add(kickHead);
            
            // Tower base plate
            const kickBase = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 0.3), kickTowerMat);
            kickBase.position.set(0, 0.025, 0.15);
            group.add(kickBase);
            
            // Kick pedal
            const kickPedal = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.35), chromeMat);
            kickPedal.position.set(0, 0.02, 0.55);
            group.add(kickPedal);
            
            // SNARE DRUM - left side, near hi-hat
            createPad(-0.4, 0.9, 0.4, 0.18, 'snare', 0.15);
            
            // HI-HAT - far left
            const hihatStand = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 1.1, 8), chromeMat);
            hihatStand.position.set(-0.8, 0.55, 0.35);
            group.add(hihatStand);
            
            const hihatBottom = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.015, 24), cymbalMat);
            hihatBottom.position.set(-0.8, 1.05, 0.35);
            group.add(hihatBottom);
            
            const hihatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.015, 24), cymbalMat);
            hihatTop.position.set(-0.8, 1.1, 0.35);
            hihatTop.userData.drumType = 'hihat';
            hihatTop.userData.isDrumPad = true;
            group.add(hihatTop);
            
            const hihatPedal = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 0.25), chromeMat);
            hihatPedal.position.set(-0.8, 0.01, 0.6);
            group.add(hihatPedal);
            
            // HI TOM - left of center, mounted high
            createPad(-0.25, 1.15, -0.2, 0.14, 'hitom', 0.25);
            
            // MID TOM - center, mounted high
            createPad(0.15, 1.15, -0.25, 0.15, 'midtom', 0.25);
            
            // LOW TOM (Floor tom) - far right, lower
            createPad(0.75, 0.7, 0.1, 0.2, 'lowtom', 0.1);
            
            // Floor tom legs
            for (let i = 0; i < 3; i++) {
                const angle = (i * 2 * Math.PI / 3) + Math.PI / 6;
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 8), chromeMat);
                leg.position.set(0.75 + Math.cos(angle) * 0.15, 0.25, 0.1 + Math.sin(angle) * 0.15);
                leg.rotation.x = 0.1;
                group.add(leg);
            }
            
            // CRASH 1 - left side
            createCymbal(-0.65, 1.4, -0.35, 0.22, 'crash1', 0.15);
            
            // CRASH 2 - right side (tilted down toward drummer)
            createCymbal(0.7, 1.45, -0.4, 0.24, 'crash2', -0.35);
            
            // Drum module/brain - mounted on left
            const module = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.05), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
            module.position.set(-1.0, 1.2, 0.2);
            module.rotation.y = 0.3;
            group.add(module);

            const moduleScreen = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.25, 0.01), new THREE.MeshBasicMaterial({ color: 0x0066ff, transparent: true, opacity: 0.7 }));
            moduleScreen.position.set(-0.98, 1.22, 0.22);
            moduleScreen.rotation.y = 0.3;
            group.add(moduleScreen);
            
            // Throne/stool
            const thronePost = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.5, 8), chromeMat);
            thronePost.position.set(0, 0.25, 1.0);
            group.add(thronePost);
            
            const throneBase = new THREE.Group();
            for (let i = 0; i < 5; i++) {
                const angle = (i * 2 * Math.PI / 5);
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8), chromeMat);
                leg.position.set(Math.cos(angle) * 0.2, 0.05, Math.sin(angle) * 0.2);
                leg.rotation.z = Math.PI / 2;
                leg.rotation.y = angle;
                throneBase.add(leg);
            }
            throneBase.position.set(0, 0, 1.0);
            group.add(throneBase);
            
            const throneSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
            throneSeat.position.set(0, 0.55, 1.0);
            group.add(throneSeat);

            group.position.set(x, y, z);
            scene.add(group);
            
            group.traverse((child) => {
                if (child.userData.isDrumPad) drumPads.push(child);
            });
        }

        function loadTVPhotos() {
            CONFIG.photos.forEach((url, i) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    tvPhotoImages[i] = img;
                    if (tvPhotoImages.filter(Boolean).length === CONFIG.photos.length) {
                        tvPhotosLoaded = true;
                    }
                };
                img.src = url;
            });
        }
        
        function updateTVDisplay() {
            if (!tvDisplayCanvas || !tvPhotosLoaded) return;
            
            const ctx = tvDisplayCanvas.getContext('2d');
            
            // Black background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 512, 288);
            
            // Draw current photo
            const img = tvPhotoImages[currentPhotoIndex];
            if (img) {
                // Calculate aspect ratio to fit
                const imgAspect = img.width / img.height;
                const canvasAspect = 512 / 288;
                
                let drawWidth, drawHeight, drawX, drawY;
                
                if (imgAspect > canvasAspect) {
                    // Image is wider - fit to width
                    drawWidth = 512;
                    drawHeight = 512 / imgAspect;
                    drawX = 0;
                    drawY = (288 - drawHeight) / 2;
                } else {
                    // Image is taller - fit to height
                    drawHeight = 288;
                    drawWidth = 288 * imgAspect;
                    drawX = (512 - drawWidth) / 2;
                    drawY = 0;
                }
                
                ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
            }
            
            if (tvDisplayTexture) {
                tvDisplayTexture.needsUpdate = true;
            }
        }

        function setupPlaylistFolders() {
            const foldersContainer = document.getElementById('playlist-folders');
            foldersContainer.innerHTML = '';
            
            CONFIG.playlists.forEach((playlist, i) => {
                const item = document.createElement('div');
                item.className = 'folder-item' + (i === currentPlaylist ? ' active' : '') + (playlist.locked ? ' locked' : '');
                item.innerHTML = `<span class="folder-icon">${playlist.icon}</span><span class="folder-name">${playlist.name}</span>`;
                
                const action = () => {
                    if (playlist.locked) {
                        showSecretModal(i);
                    } else {
                        selectPlaylist(i);
                    }
                };
                
                item.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    action();
                }, { passive: false });
                
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    action();
                });
                
                foldersContainer.appendChild(item);
            });
        }
        
        function selectPlaylist(index) {
            currentPlaylist = index;
            currentTrack = 0;
            
            // Update folder highlights
            document.querySelectorAll('.folder-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            // Update tracks
            const playlist = document.getElementById('playlist');
            playlist.innerHTML = '';
            
            const tracks = CONFIG.playlists[index].tracks;
            if (tracks.length === 0) {
                playlist.innerHTML = '<div class="playlist-empty">No tracks yet</div>';
            } else {
                tracks.forEach((track, i) => {
                    const item = document.createElement('div');
                    item.className = 'playlist-item' + (i === 0 ? ' active' : '');
                    item.innerHTML = `<span class="track-num">${i + 1}</span><div class="track-info"><div class="name">${track.title}</div></div>`;
                    
                    const playTrack = () => {
                        selectTrack(i);
                        // Auto play
                        if (!isPlaying) {
                            audioElement.play().then(() => {
                                isPlaying = true;
                                document.getElementById('play-pause-btn').textContent = '⏸';
                                document.getElementById('album-art').classList.add('playing');
                                setupAudioAnalyser();
                            }).catch(err => console.log('Play error:', err));
                        }
                    };
                    
                    item.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        playTrack();
                    }, { passive: false });
                    
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        playTrack();
                    });
                    
                    playlist.appendChild(item);
                });
            }
        }

            const playlistIndex = parseInt(document.getElementById('secret-modal').dataset.playlistIndex);
            const playlist = CONFIG.playlists[playlistIndex];
            const answer = document.getElementById('secret-answer').value.toLowerCase().trim();

        function setupEvents() {
            // Keyboard events
            document.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (e.key.toLowerCase() === 'e' && nearStation && !currentStation) enterStation(nearStation);
                if (e.key === 'Escape' && currentStation) exitStation();
                if (e.key === ' ' && isGrounded && !currentStation && gameStarted) {
                    verticalVelocity = jumpForce;
                    isGrounded = false;
                    playJumpSound();
                    e.preventDefault();
                }
            });
            document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
            
            // Resize handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // 3D Raycasting for drums/synth
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            function handle3DInteraction(clientX, clientY) {
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                
                // Check drums
                const drumIntersects = raycaster.intersectObjects(drumPads, false);
                if (drumIntersects.length > 0) {
                    const drumType = drumIntersects[0].object.userData.drumType;
                    if (drumType) {
                        playDrumSound(drumType);
                        return true;
                    }
                }
                
                // Check synth buttons
                if (synthSoundButton && arpeggioButton) {
                    const buttonIntersects = raycaster.intersectObjects([synthSoundButton, arpeggioButton], false);
                    if (buttonIntersects.length > 0) {
                        const btn = buttonIntersects[0].object;
                        if (btn.userData.isSoundButton) {
                            synthSoundType = (synthSoundType + 1) % 4;
                            const colors = [0xff6600, 0x00ff66, 0x6600ff, 0xff0066];
                            soundButtonLight.material.color.setHex(colors[synthSoundType]);
                            updateSynthDisplay();
                            return true;
                        }
                        if (btn.userData.isArpButton) {
                            arpeggioEnabled = !arpeggioEnabled;
                            arpButtonLight.material.color.setHex(arpeggioEnabled ? 0x00ffff : 0x333333);
                            if (!arpeggioEnabled) stopArpeggio();
                            updateSynthDisplay();
                            return true;
                        }
                    }
                }
                
                // Check synth keys
                const synthIntersects = raycaster.intersectObjects(synthKeys, false);
                if (synthIntersects.length > 0) {
                    const obj = synthIntersects[0].object;
                    if (obj.userData.isSynthKey) {
                        playSynthSound(obj.userData.noteIndex);
                        return true;
                    }
                }
                
                return false;
            }
            
            // Desktop click for 3D objects
            renderer.domElement.addEventListener('click', (e) => {
                if (currentStation && (currentStation.type === 'drums' || currentStation.type === 'synth')) {
                    handle3DInteraction(e.clientX, e.clientY);
                }
            });
            
            // Mouse cursor change
            renderer.domElement.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const drumIntersects = raycaster.intersectObjects(drumPads, false);
                const synthIntersects = raycaster.intersectObjects(synthKeys, false);
                const buttonObjects = synthSoundButton && arpeggioButton ? [synthSoundButton, arpeggioButton] : [];
                const buttonIntersects = raycaster.intersectObjects(buttonObjects, false);
                renderer.domElement.style.cursor = (drumIntersects.length > 0 || synthIntersects.length > 0 || buttonIntersects.length > 0) ? 'pointer' : 'default';
            });
            
            // Touch for 3D objects (drums, synth) - handles taps and swipes
            let lastSynthTouchX = 0;
            let lastDrumTouch = 0;
            
            renderer.domElement.addEventListener('touchstart', (e) => {
                if (currentStation && (currentStation.type === 'drums' || currentStation.type === 'synth')) {
                    const touch = e.touches[0];
                    lastSynthTouchX = touch.clientX;
                    
                    // Immediate tap handling for drums and synth
                    const now = Date.now();
                    if (now - lastDrumTouch > 50) { // Debounce
                        handle3DInteraction(touch.clientX, touch.clientY);
                        lastDrumTouch = now;
                    }
                    e.preventDefault();
                }
            }, { passive: false });
            
            renderer.domElement.addEventListener('touchmove', (e) => {
                // Swipe across synth keys
                if (currentStation && currentStation.type === 'synth') {
                    const touch = e.touches[0];
                    // Trigger on horizontal movement
                    if (Math.abs(touch.clientX - lastSynthTouchX) > 15) {
                        handle3DInteraction(touch.clientX, touch.clientY);
                        lastSynthTouchX = touch.clientX;
                    }
                    e.preventDefault();
                }
            }, { passive: false });
            
            renderer.domElement.addEventListener('touchend', (e) => {
                // Also trigger on touch end for better responsiveness
                if (currentStation && (currentStation.type === 'drums' || currentStation.type === 'synth')) {
                    if (e.changedTouches && e.changedTouches[0]) {
                        const touch = e.changedTouches[0];
                        handle3DInteraction(touch.clientX, touch.clientY);
                    }
                }
            }, { passive: true });
            
            // Mobile controls setup
            setupMobileControls();
        }
        
        function setupMobileControls() {
            // Detect mobile
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                || ('ontouchstart' in window) 
                || (window.innerWidth <= 900);
            
            window.mobileMove = { x: 0, z: 0 };
            window.isMobileDevice = isMobile;
            
            // ========================================
            // MOBILE MOVEMENT - Touch and drag anywhere
            // ========================================
            let moveTouch = null;
            let lastX = 0, lastY = 0;
            
            document.addEventListener('touchstart', (e) => {
                // Don't start movement if touching UI elements
                if (e.target.closest('#computer-interface') || 
                    e.target.closest('#tv-interface') || 
                    e.target.closest('#secret-modal') ||
                    e.target.closest('.mobile-buttons') ||
                    e.target.closest('#drums-interface') ||
                    e.target.closest('#synth-interface')) {
                    return;
                }
                if (currentStation) return;
                
                moveTouch = e.touches[0].identifier;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }, { passive: true });
            
            document.addEventListener('touchmove', (e) => {
                if (moveTouch === null || currentStation) return;
                
                for (let touch of e.touches) {
                    if (touch.identifier === moveTouch) {
                        const dx = touch.clientX - lastX;
                        const dy = touch.clientY - lastY;
                        lastX = touch.clientX;
                        lastY = touch.clientY;
                        
                        window.mobileMove.x = dx * 0.015;
                        window.mobileMove.z = dy * 0.015;
                        break;
                    }
                }
            }, { passive: true });
            
            document.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === moveTouch) {
                        moveTouch = null;
                        window.mobileMove.x = 0;
                        window.mobileMove.z = 0;
                        break;
                    }
                }
            }, { passive: true });
            
            // ========================================
            // MOBILE BUTTONS - Jump, Interact, Exit
            // ========================================
            const btnJump = document.getElementById('btn-jump');
            const btnInteract = document.getElementById('btn-interact');
            const btnExit = document.getElementById('btn-exit');
            
            function setupButton(btn, action) {
                if (!btn) return;
                
                const handler = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    action();
                };
                
                btn.addEventListener('touchstart', handler, { passive: false });
                btn.addEventListener('mousedown', handler);
            }
            
            setupButton(btnJump, () => {
                if (isGrounded && !currentStation && gameStarted) {
                    verticalVelocity = jumpForce;
                    isGrounded = false;
                    playJumpSound();
                }
            });
            
            setupButton(btnInteract, () => {
                if (nearStation && !currentStation) {
                    enterStation(nearStation);
                }
            });
            
            setupButton(btnExit, () => {
                if (currentStation) {
                    exitStation();
                }
            });
            
            // ========================================
            // TAP ON STATION CIRCLES
            // ========================================
            setupStationTapInteraction();
            
            // ========================================
            // MUSIC PLAYER CONTROLS - Add touch handlers
            // ========================================
            setupMusicPlayerTouch();
        }
        
        function setupMusicPlayerTouch() {
            // Helper to make any element tappable
            function makeTappable(element, action) {
                if (!element) return;
                
                element.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    action();
                }, { passive: false });
                
                element.addEventListener('click', (e) => {
                    e.stopPropagation();
                    action();
                });
            }
            
            // Transport buttons
            makeTappable(document.getElementById('prev-btn'), prevTrack);
            makeTappable(document.getElementById('play-pause-btn'), togglePlay);
            makeTappable(document.getElementById('next-btn'), nextTrack);
            
            // Close buttons
            makeTappable(document.getElementById('computer-close-btn'), exitStation);
            makeTappable(document.getElementById('tv-close-btn'), exitStation);
            makeTappable(document.getElementById('drums-close-btn'), exitStation);
            makeTappable(document.getElementById('synth-close-btn'), exitStation);
            
            // Secret modal
            makeTappable(document.getElementById('secret-submit-btn'), checkSecretAnswer);
            makeTappable(document.getElementById('secret-cancel-btn'), closeSecretModal);
            
            // Progress bar
            const progressBar = document.getElementById('progress-bar');
            if (progressBar) {
                const seek = (clientX) => {
                    const rect = progressBar.getBoundingClientRect();
                    const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    if (audioElement && audioElement.duration) {
                        audioElement.currentTime = percent * audioElement.duration;
                    }
                };
                
                progressBar.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    seek(e.touches[0].clientX);
                }, { passive: false });
                
                progressBar.addEventListener('click', (e) => {
                    seek(e.clientX);
                });
            }
        }
        
        function playJumpSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            
            // Random variation for each jump
            const baseFreq = 280 + Math.random() * 60; // 280-340 Hz range
            const duration = 0.12 + Math.random() * 0.04; // 0.12-0.16s
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + duration * 0.3);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.8, now + duration);
            
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start(now);
            osc.stop(now + duration);
        }
        
        function setupStationTapInteraction() {
            const raycaster = new THREE.Raycaster();
            const tapPosition = new THREE.Vector2();
            
            renderer.domElement.addEventListener('touchstart', (e) => {
                // Don't process if touching control buttons
                if (e.target.closest('.mobile-buttons')) return;
                if (currentStation) return;
                
                const touch = e.touches[0];
                tapPosition.x = (touch.clientX / window.innerWidth) * 2 - 1;
                tapPosition.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(tapPosition, camera);
                
                // Check if tapped on a station indicator
                const indicators = stations.map(s => s.indicator).filter(i => i);
                const intersects = raycaster.intersectObjects(indicators, false);
                
                if (intersects.length > 0) {
                    const tappedIndicator = intersects[0].object;
                    const station = stations.find(s => s.indicator === tappedIndicator);
                    if (station) {
                        e.preventDefault();
                        enterStation(station);
                        return;
                    }
                }
            }, { passive: false });
        }
