<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>song ideas</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>SONG IDEAS</h1><section class="player"><div class="lcd"><span id="now">SELECT A SONG</span><b id="clock">0:00 / 0:00</b></div><div class="controls"><button id="prev">|&lt;</button><button id="play">PLAY</button><button id="next">&gt;|</button><input id="seek" type="range" min="0" max="100" value="0"></div><button id="browse">BROWSE SONGS</button><audio id="audio"></audio></section><section id="queue" hidden><p>PLAYLIST // SHOW CLIENTS</p><ol id="list"></ol></section><p class="mail"><a href="mailto:whoisthemetro@gmail.com?subject=Song%20ideas">EMAIL METRO</a></p></main><script src="tracks.js"></script><script>const a=document.querySelector('#audio'),l=document.querySelector('#list'),n=document.querySelector('#now'),c=document.querySelector('#clock'),s=document.querySelector('#seek'),p=document.querySelector('#play'),q=document.querySelector('#queue'),b=document.querySelector('#browse');let i=0;const f=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;function go(x){i=(x+tracks.length)%tracks.length;let t=tracks[i];a.src=t.url;n.textContent=`${String(t.order).padStart(2,'0')} // ${t.title.toUpperCase()} — ${t.artist.toUpperCase()}`;[...l.children].forEach((e,j)=>e.classList.toggle('on',j===i));a.play().catch(()=>{});}l.innerHTML=tracks.map((t,j)=>`<li><button data-n="${j}"><i>${String(t.order).padStart(2,'0')}</i><span>${t.title}<small>${t.artist}</small></span><em>${f(t.duration)}</em></button></li>`).join('');b.onclick=()=>{q.hidden=!q.hidden;b.textContent=q.hidden?'BROWSE SONGS':'CLOSE SONG LIST'};l.onclick=e=>{let x=e.target.closest('button');if(x)go(+x.dataset.n)};p.onclick=()=>a.paused?go(i):a.pause();document.querySelector('#prev').onclick=()=>go(i-1);document.querySelector('#next').onclick=()=>go(i+1);a.onplay=()=>p.textContent='PAUSE';a.onpause=()=>p.textContent='PLAY';a.ontimeupdate=()=>{s.value=a.duration?a.currentTime/a.duration*100:0;c.textContent=`${f(a.currentTime)} / ${f(a.duration||0)}`};s.oninput=()=>a.duration&&(a.currentTime=s.value/100*a.duration);a.onended=()=>go(i+1);</script></body></html>
