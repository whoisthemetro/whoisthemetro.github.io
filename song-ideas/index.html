<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>song ideas</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>SONG IDEAS</h1><section class="player"><div class="lcd"><span id="now">SELECT A SONG</span><b id="clock">0:00 / 0:00</b></div><div class="controls"><button id="prev">|&lt;</button><button id="play">PLAY</button><button id="next">&gt;|</button><input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"></div><audio id="audio" preload="metadata"></audio></section><p class="label">PLAYLIST // SHOW CLIENTS</p><ol id="list"></ol><p class="mail"><a href="mailto:whoisthemetro@gmail.com?subject=Song%20ideas">EMAIL METRO</a></p></main><script src="tracks.js"></script><script>
const a=document.querySelector('#audio'),list=document.querySelector('#list'),now=document.querySelector('#now'),clock=document.querySelector('#clock'),seek=document.querySelector('#seek'),play=document.querySelector('#play');let i=0;const fmt=n=>`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;function pick(n){i=(n+tracks.length)%tracks.length;const t=tracks[i];a.src=t.url;now.textContent=`${String(t.order).padStart(2,'0')} // ${t.title.toUpperCase()} — ${t.artist.toUpperCase()}`;[...list.children].forEach((x,j)=>x.classList.toggle('on',j===i));a.play().then(()=>play.textContent='PAUSE').catch(()=>play.textContent='PLAY')}list.innerHTML=tracks.map((t,n)=>`<li><button data-n="${n}"><i>${String(t.order).padStart(2,'0')}</i><span>${t.title}<small>${t.artist}</small></span><em>${fmt(t.duration)}</em></button></li>`).join('');list.onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.n)};play.onclick=()=>a.paused?pick(i):a.pause();document.querySelector('#prev').onclick=()=>pick(i-1);document.querySelector('#next').onclick=()=>pick(i+1);a.onpause=()=>play.textContent='PLAY';a.onplay=()=>play.textContent='PAUSE';a.ontimeupdate=()=>{seek.value=a.duration?a.currentTime/a.duration*100:0;clock.textContent=`${fmt(a.currentTime)} / ${fmt(a.duration||0)}`};seek.oninput=()=>{if(a.duration)a.currentTime=seek.value/100*a.duration};a.onended=()=>pick(i+1);
</script></body></html>
