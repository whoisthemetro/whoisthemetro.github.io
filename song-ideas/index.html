<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>song ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="styles.css?v=6"></head><body><canvas id="bg"></canvas><main>
<section class="player">
  <span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>
  <header class="hud">
    <span class="lamp"><i class="led pwr"></i>PWR</span>
    <span class="lamp"><i class="led" id="ledsig"></i>SIG</span>
    <span class="lamp"><i class="led amber" id="ledloop"></i>LOOP</span>
    <span class="lamp"><i class="led" id="ledlvl"></i>A-LVL</span>
    <span class="grow"></span>
    <span class="ro" id="chan">CH 01/55</span><span class="ro dim" id="met">MET 00:00:00</span>
  </header>
  <div class="lcd">
    <div class="ln"><span class="tag">TRK</span><span id="now">SELECT A SONG</span></div>
    <div class="ln big"><span class="tag">T+</span><b id="clock">0:00.0</b><span id="dur">/ 0:00</span><canvas id="meter"></canvas></div>
    <div class="ln tele" id="tele">LIFT --- · GAIN 0.0 dB · LOOP ---</div>
  </div>
  <div id="vis" hidden><canvas id="viscv" title="tap: next look · double-click: full screen"></canvas><span id="visname"></span><button id="visfull" title="full screen (double-click)">⛶</button></div>
  <canvas id="wave" title="click to jump · drag to loop a section · drag the A/B flags to adjust"></canvas>
  <canvas id="over" title="whole song — drag to move the zoomed view"></canvas>
  <div class="controls">
    <button id="prev" title="previous">PREV</button><button id="play">PLAY</button><button id="next" title="next">NEXT</button>
    <button id="visbtn" title="visualizer (V)">VIS</button><span class="grow"></span>
    <button id="zout" title="zoom out (-)">−</button><button id="zin" title="zoom in (+)">+</button>
    <button id="loop" title="loop (L)">LOOP</button>
  </div>
  <div class="vol"><label for="vol">GAIN</label><span class="volwrap"><input id="vol" type="range" min="-40" max="12" step="0.5" value="0" title="double-click for unity"></span><b id="volout">0 dB</b><button id="lvl" title="lift quiet songs up to the level of the rest">AUTO LVL</button></div>
  <div class="row"><button id="browse">BROWSE SONGS</button><a id="dl" class="btn" download title="download this song">DOWNLOAD</a></div>
  <audio id="audio" crossorigin="anonymous" preload="none"></audio>
</section>
<section id="queue" hidden><p>CATALOG · SHOW CLIENTS · 55</p><ol id="list"></ol></section>
</main>
<script src="tracks.js?v=6"></script><script src="player.js?v=6"></script><script src="vis.js?v=6"></script><script src="bg.js?v=6"></script></body></html>
