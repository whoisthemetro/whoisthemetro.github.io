<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>song ideas</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>SONG IDEAS</h1>
<section class="player">
  <div class="lcd"><span id="now">SELECT A SONG</span><b id="clock">0:00 / 0:00</b></div>
  <canvas id="wave" title="click to jump · drag to loop a section · drag the A/B flags to adjust"></canvas>
  <canvas id="over" title="whole song — drag to move the zoomed view"></canvas>
  <div class="controls">
    <button id="prev" title="previous">|&lt;</button><button id="play">PLAY</button><button id="next" title="next">&gt;|</button>
    <span class="grow"></span>
    <button id="zout" title="zoom out (-)">−</button><button id="zin" title="zoom in (+)">+</button>
    <button id="loop" title="loop (L)">LOOP: OFF</button>
  </div>
  <div class="ab">
    <span class="pt"><i>A</i><button data-nudge="a,-1" title="earlier (hold to move faster)">‹</button><b id="aout">-:--.--</b><button data-nudge="a,1" title="later (hold to move faster)">›</button><button id="seta" title="set A at the playhead (I)">SET</button></span>
    <span class="pt"><i>B</i><button data-nudge="b,-1" title="earlier (hold to move faster)">‹</button><b id="bout">-:--.--</b><button data-nudge="b,1" title="later (hold to move faster)">›</button><button id="setb" title="set B at the playhead (O)">SET</button></span>
    <button id="clear">CLEAR</button>
  </div>
  <div class="vol"><label for="vol">VOL</label><span class="volwrap"><input id="vol" type="range" min="-40" max="12" step="0.5" value="0" title="double-click for unity"></span><b id="volout">0 dB</b><button id="lvl" title="lift quiet songs up to the level of the rest">AUTO LEVEL: ON</button></div>
  <div class="row"><button id="browse">BROWSE SONGS</button><a id="dl" class="btn" download title="download this song">DOWNLOAD</a></div>
  <audio id="audio" crossorigin="anonymous" preload="none"></audio>
</section>
<p class="keys">SPACE play · I / O set A / B · L loop · + / − zoom</p>
<section id="queue" hidden><p>PLAYLIST // SHOW CLIENTS</p><ol id="list"></ol></section>
<p class="mail"><a href="mailto:whoisthemetro@gmail.com?subject=Song%20ideas">EMAIL METRO</a></p></main>
<script src="tracks.js"></script><script src="player.js"></script></body></html>
