<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>THE METRO — bedroom (Babylon)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0a0c; overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #e9e6df; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* enter gate — same ritual as the three.js world */
  #gate { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
    background: radial-gradient(120% 100% at 50% 30%, #15151c 0%, #060608 70%); transition: opacity .8s ease; }
  #gate.gone { opacity: 0; pointer-events: none; }
  #gate .card { text-align: center; max-width: 30rem; padding: 2rem; }
  #gate h1 { font-size: 1.05rem; letter-spacing: .42em; margin: 0 0 .2rem; text-indent: .42em;
    color: #ff3bd0; text-shadow: 0 0 22px rgba(255,59,208,.55); }
  #gate .sub { font-size: .72rem; letter-spacing: .28em; color: #7d7a86; margin-bottom: 1.8rem; text-indent: .28em; }
  #enter-btn { font: inherit; font-size: .8rem; letter-spacing: .26em; text-indent: .26em;
    padding: .85rem 2.2rem; color: #eee; background: #16161e; cursor: pointer;
    border: 1px solid #34343f; border-radius: 999px; transition: all .2s ease; }
  #enter-btn:hover { background: #20202b; border-color: #ff3bd0; box-shadow: 0 0 26px rgba(255,59,208,.25); }
  #enter-btn:disabled { opacity: .5; cursor: progress; }
  #loadbar { width: 14rem; height: 2px; background: #26262e; margin: 1.4rem auto 0; border-radius: 2px; overflow: hidden; }
  #loadbar > i { display: block; height: 100%; width: 0%; background: #ff3bd0; transition: width .25s ease; }

  /* in-world hint */
  #hint { position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%); z-index: 6;
    font-size: .64rem; letter-spacing: .18em; color: #aaa6b0; background: rgba(8,8,11,.55);
    padding: .5rem .9rem; border-radius: 999px; border: 1px solid #2a2a33; opacity: 0;
    transition: opacity .5s ease; backdrop-filter: blur(6px); pointer-events: none; white-space: nowrap; }
  #hint.show { opacity: 1; }
  #badge { position: fixed; left: 1rem; top: 1rem; z-index: 6; font-size: .58rem; letter-spacing: .2em;
    color: #6a6772; opacity: 0; transition: opacity .5s; }
  #badge.show { opacity: 1; }
  #credits { position: fixed; right: 1rem; bottom: .6rem; z-index: 6; font-size: .5rem; letter-spacing: .08em;
    color: #56535c; opacity: 0; transition: opacity .5s; max-width: 60vw; text-align: right; }
  #credits.show { opacity: 1; }
</style>
</head>
<body>
  <canvas id="stage" tabindex="0"></canvas>

  <div id="badge">BABYLON · PHASE 1 · BEDROOM</div>
  <div id="credits">3D models: BoomBox — Khronos (CC0) · guitar pedal — Peter Simcoe / Poly Pizza (CC-BY)</div>
  <div id="hint"></div>

  <div id="gate">
    <div class="card">
      <h1>THE METRO</h1>
      <div class="sub">bedroom — rebuilt in babylon</div>
      <button id="enter-btn" disabled>loading…</button>
      <div id="loadbar"><i></i></div>
    </div>
  </div>

  <!-- Babylon 9.x from the official CDN (UMD globals). no bundler — matches the site's no-build rule. -->
  <script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>

  <script type="module" src="../assets/js/babylon-bedroom.js"></script>
</body>
</html>
