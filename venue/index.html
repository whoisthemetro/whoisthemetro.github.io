<!-- /venue is the 3D world now (not the old flat watch page). bounce everyone to
     the root world with the #venue hash, which main.js reads on entry to walk
     you straight into THE VENUE instead of starting in the bedroom. carry an
     #admin through as #venue,admin so /venue#admin still hosts the booth. -->
<meta http-equiv="refresh" content="0; url=/#venue" />
<script>
  var admin = /admin/i.test(location.hash);
  location.replace("/#venue" + (admin ? ",admin" : ""));
</script>
