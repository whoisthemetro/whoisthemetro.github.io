<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BFAM — Disoriented</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎛️</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #181a1b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e8e6e3;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    /* soft vignette over the 3D world */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(8, 9, 10, 0.55) 100%);
      z-index: 5;
    }

    .brand {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
    }
    .brand h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.35em;
    }

    .player-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 18px 18px 12px;
      border-radius: 20px;
      background: rgba(20, 22, 24, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 0 80px rgba(5, 108, 196, 0.28),
        0 0 24px rgba(100, 210, 255, 0.12),
        0 30px 90px rgba(0, 0, 0, 0.65);
    }
    .player-card .eyebrow {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #64d2ff;
      margin-bottom: 10px;
      text-align: center;
    }
    .player-card iframe {
      display: block;
      border-radius: 10px;
    }

    .hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(190, 205, 215, 0.55);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9);
      animation: hintFade 2.4s ease 1s both;
    }
    @keyframes hintFade {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 600px), (max-height: 520px) {
      .player-card {
        padding: 10px 12px 8px;
        border-radius: 14px;
      }
      .player-card .eyebrow {
        margin-bottom: 8px;
        font-size: 9px;
      }
      .brand h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="vignette"></div>

  <header class="brand">
    <h1>BFAM</h1>
  </header>

  <main class="player-card">
    <div class="eyebrow">New Album</div>
    <div id="player"></div>
  </main>

  <script>
    // Compact Bandcamp player on small screens, full-size artwork player otherwise
    (function () {
      const mq = window.matchMedia('(max-width: 600px), (max-height: 520px)');
      const holder = document.getElementById('player');
      const base = 'https://bandcamp.com/EmbeddedPlayer/album=1287212939/size=large/bgcol=181a1b/linkcol=056cc4/tracklist=false/transparent=true/';
      const fallback = '<a href="https://wearebfam.bandcamp.com/album/disoriented">Disoriented by BFAM</a>';
      let mode = '';
      function render() {
        const next = mq.matches ? 'compact' : 'full';
        if (next === mode) return;
        mode = next;
        holder.innerHTML = next === 'compact'
          ? '<iframe style="border: 0; width: 76vw; max-width: 330px; height: 120px;" src="' + base + 'artwork=small/" seamless>' + fallback + '</iframe>'
          : '<iframe style="border: 0; width: 350px; height: 470px;" src="' + base + '" seamless>' + fallback + '</iframe>';
      }
      mq.addEventListener('change', render);
      render();
    })();
  </script>

  <div class="hint">Drag to explore &middot; scroll to zoom</div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="app.js"></script>
</body>
</html>
